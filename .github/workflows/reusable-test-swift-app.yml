name: Test Swift app

on:
  workflow_call:
    inputs:
      save_cache:
        description: "Whether to save cache (true) or only load (false)"
        required: true
        type: boolean

jobs:
  test_swift_app:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: MacOS version
        run: sw_vers
      - uses: actions/checkout@v4
      - uses: gsabran/setup-swift@main
        with:
          swift-version: "6.2"
          soft-fail-version-check: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - uses: actions/setup-node@v4
        with:
          node-version-file: "./local-server/.nvmrc"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: cd local-server && yarn install && yarn build && yarn copy-to-app
      - name: Run app module tests
        run: ./cmd.sh test:swift
